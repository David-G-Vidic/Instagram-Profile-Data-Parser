<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Instagram Data Parser</title>
        <H1>Instagram Data Parser</H1>
    </head>


<body>
    {% if form %}

    <p>form:</p>
    <form action="{% url 'upload' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <p>
            {{ form.file}}
        </p>
        <p><input type="submit" value="Upload" /></p>
    </form>
   {% endif %}

   <p>
    {% if page %}
        Page: {{ page }}
    {% endif %} 
   </p> 

</body>

</html>
